name: Tests

# EditMode tests, run against a throwaway project generated here rather than against any checked-in
# consuming project — the tests live in this repo (PackageBuilder/Tests/), so the only thing a project
# is needed for is to give Unity something to open and a manifest to resolve the package through.
#
# Requires a Unity licence, so it cannot run on a pull request from a fork: GitHub withholds secrets
# there. Those runs are skipped rather than failed, and reviewed by running the suite locally.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: EditMode and PlayMode
    # Fork PRs get no secrets, so the licence would be empty and every such run would redline for a
    # reason the contributor cannot fix.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: The licence secrets are present and well-formed
        # Cheap triage before the 5 GB image pull. Activation failure retries three times with
        # backoff, so a secret that is simply absent or has a stray newline otherwise costs minutes
        # and reports itself as a login failure. Values are never printed, only their shape.
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail

          fail=0

          for name in UNITY_EMAIL UNITY_PASSWORD UNITY_LICENSE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or unset. Add it under Settings > Secrets and variables > Actions."
              fail=1
            fi
          done

          # Only the single-line secrets: a .ulf legitimately ends with a newline.
          for name in UNITY_EMAIL UNITY_PASSWORD; do
            value="${!name}"
            trimmed=$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -n "$value" ] && [ "$value" != "$trimmed" ]; then
              echo "::error::$name has leading or trailing whitespace, which Unity sends verbatim and rejects. Re-add the secret without the stray character."
              fail=1
            fi
          done

          case "${UNITY_LICENSE:-}" in
            *"<License"*) ;;
            "") ;;
            *) echo "::error::UNITY_LICENSE does not contain a <License> element, so it is not the contents of a .ulf file. Paste the whole of Unity_lic.ulf, opening tag to closing tag."; fail=1 ;;
          esac

          if [ "$fail" -ne 0 ]; then
            echo "::error::Fix the secrets above before this job can activate a licence."
            exit 1
          fi

          echo "All three licence secrets are present and shaped correctly."

      - name: Check out the package
        uses: actions/checkout@v4
        with:
          path: package

      - name: Turn the workspace itself into a project that consumes the package
        # The project lives at the workspace root rather than in a subdirectory, so that projectPath
        # can be left unset below. Passing it a subdirectory made the action resolve it against the
        # container workspace twice — "Couldn't set project path to: /github/workspace/github/
        # workspace/test-project". Unset, it defaults to the workspace and resolves once.
        #
        # "testables" is the load-bearing line. Both test assemblies are gated on UNITY_INCLUDE_TESTS,
        # which Unity only defines for packages listed here — omit it and the assemblies never compile,
        # the run finds zero tests, and it passes. Hence the test-count assertion further down.
        #
        # Package versions are the ones the real consuming project resolves against this editor, not
        # guesses. The built-in modules cost nothing: they ship inside the editor image already.
        run: |
          set -euo pipefail

          mkdir -p Packages ProjectSettings Assets

          cat > Packages/manifest.json <<'JSON'
          {
            "testables": ["com.flock.sdk"],
            "dependencies": {
              "com.flock.sdk": "file:../package",
              "com.unity.nuget.newtonsoft-json": "3.2.2",
              "com.unity.test-framework": "1.6.0",
              "com.unity.modules.androidjni": "1.0.0",
              "com.unity.modules.animation": "1.0.0",
              "com.unity.modules.assetbundle": "1.0.0",
              "com.unity.modules.audio": "1.0.0",
              "com.unity.modules.imageconversion": "1.0.0",
              "com.unity.modules.imgui": "1.0.0",
              "com.unity.modules.jsonserialize": "1.0.0",
              "com.unity.modules.screencapture": "1.0.0",
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.uielements": "1.0.0",
              "com.unity.modules.unitywebrequest": "1.0.0",
              "com.unity.modules.unitywebrequestassetbundle": "1.0.0",
              "com.unity.modules.unitywebrequestaudio": "1.0.0",
              "com.unity.modules.unitywebrequesttexture": "1.0.0",
              "com.unity.modules.unitywebrequestwww": "1.0.0"
            }
          }
          JSON

          cat > ProjectSettings/ProjectVersion.txt <<'TXT'
          m_EditorVersion: 6000.3.16f1
          TXT

          echo "Generated a project at the workspace root, consuming package/:"
          cat Packages/manifest.json

      - name: Cache the Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('package/**/*.cs', 'Packages/manifest.json') }}
          restore-keys: |
            Library-

      - name: Run the tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # projectPath is deliberately unset — see the note on the generate step above.
          unityVersion: 6000.3.16f1
          testMode: all
          artifactsPath: test-results

      - name: Every mode actually found tests
        # A green run that executed nothing is the failure this whole job exists to avoid, and it looks
        # identical to a green run that executed everything unless the count is checked. testMode "all"
        # writes one report per mode, so every report is checked — reading only the first would let an
        # empty PlayMode run hide behind a healthy EditMode one.
        if: always()
        run: |
          set -euo pipefail

          # One report per mode, named after it. Naming the modes rather than globbing is what makes a
          # mode that never ran a failure: a missing file is silence, and silence would otherwise pass.
          # If testMode above changes, change this list with it.
          EXPECTED="editmode playmode"

          bad=0
          for mode in $EXPECTED; do
            report="test-results/${mode}-results.xml"

            if [ ! -f "$report" ]; then
              echo "::error::No $mode report at $report, so that mode did not run. Read the step above for the real failure, or update EXPECTED here if testMode changed."
              bad=$((bad + 1))
              continue
            fi

            total=$(grep -oE 'total="[0-9]+"' "$report" | head -1 | grep -oE '[0-9]+' || true)
            if [ -z "$total" ]; then
              echo "::error file=$report::Could not read a total from this report. If the format changed, update this step with it."
              bad=$((bad + 1))
              continue
            fi

            if [ "$total" -eq 0 ]; then
              echo "::error file=$report::The $mode run reported 0 tests, which passes without testing anything. Usually the package stopped being listed under 'testables' in the generated manifest, so UNITY_INCLUDE_TESTS was never defined and the test assemblies were skipped."
              bad=$((bad + 1))
              continue
            fi

            echo "$total $mode tests ran."
          done

          [ "$bad" -eq 0 ]

      - name: Upload the results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
          if-no-files-found: warn
