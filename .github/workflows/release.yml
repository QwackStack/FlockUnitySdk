name: Release

# Publishes a release when a version tag is pushed (git tag v1.69.0 && git push origin v1.69.0), carrying four files:
# com.flock.sdk-<version>.tgz and com.protokite.playtest-<version>.tgz (Package Manager tarballs), and
# FlockSDK-<version>.unitypackage and ProtokitePlaytest-<version>.unitypackage, built by unity-packages.yml. The Playtesting tab in
# Flock > Settings installs the playtest from the last of these, so the release is published only once all four exist.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Cheap checks first, so a wrong tag fails in seconds rather than after the Unity build.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag is v<the package version>
        run: bash "Tooling~/check-release-tag.sh" "$GITHUB_REF_NAME" .

      - name: The playtest package is released at the same version
        run: bash "Tooling~/check-playtest-package.sh" .

  unity-packages:
    needs: checks
    uses: ./.github/workflows/unity-packages.yml
    secrets: inherit

  release:
    needs: unity-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack UPM tarballs
        # The playtest is packed outside the checkout (packed inside, its tarball would end up in the Flock SDK's), then
        # removed so the Flock SDK's tarball never carries it; the checkout is disposable. The listing is read whole
        # before it is searched: a grep that stops early breaks tar's pipe, and pipefail would then read as "clean".
        run: |
          set -euo pipefail
          playtest_out=$(mktemp -d)
          (cd "ProtokitePlaytest~" && npm pack --pack-destination "$playtest_out")
          rm -rf .github "ProtokitePlaytest~"
          npm pack
          core_entries=$(tar -tzf com.flock.sdk-*.tgz)
          if grep -qi "protokite" <<< "$core_entries"; then
            echo "::error::The Flock SDK tarball contains playtest files:" >&2
            grep -i "protokite" <<< "$core_entries" >&2
            exit 1
          fi
          mv "$playtest_out"/com.protokite.playtest-*.tgz .

      - name: Fetch the .unitypackage files the Unity job built
        # Outside the checkout, after the pack above, so no tarball can carry them.
        uses: actions/download-artifact@v4
        with:
          name: unity-packages
          path: ${{ runner.temp }}/unity-packages

      - name: Create GitHub release
        # A release may already exist when it was drafted in the web UI (publishing
        # there pushes the tag, which triggers this run) — attach the files to it.
        env:
          GH_TOKEN: ${{ github.token }}
          UNITY_PACKAGES: ${{ runner.temp }}/unity-packages
        run: |
          set -euo pipefail
          files=(com.flock.sdk-*.tgz com.protokite.playtest-*.tgz "$UNITY_PACKAGES"/*.unitypackage)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
