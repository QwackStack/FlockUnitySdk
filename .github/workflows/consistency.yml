name: Consistency

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tracked-files:
    # Package Manager installs a git package without the files .gitignore matches, even tracked ones. An unanchored
    # "docs.meta" rule once matched Runtime/Docs.meta, so every git-URL install warned that the folder had no .meta.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No tracked file is matched by an ignore rule
        run: |
          set -euo pipefail
          # Matched as on Windows and macOS, where studios install: "docs.meta" matches "Docs.meta" there, not on Linux.
          git config core.ignorecase true
          ignored=$(git ls-files -ci --exclude-standard)
          if [ -n "$ignored" ]; then
            echo "::error::These tracked files match a .gitignore rule, so a git-URL install of the package leaves them out. Narrow the rule (anchor it with a leading /):"
            echo "$ignored"
            exit 1
          fi
          echo "No tracked file is ignored."

  playtest-package:
    # The Protokite Playtest package lives in ProtokitePlaytest~ in this repository and ships from the same tag. The
    # script checks that it carries the Flock SDK's version, has no package dependency on it (studios who imported
    # Flock from the .unitypackage could not install it otherwise), is never named by the SDK's runtime, has a .meta
    # beside every file (a git-URL install leaves out any file without one), and imports only WebGL calls the SDK's own
    # library defines (a rename would fail only when a WebGL game links). Needs no Unity and no backend.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The playtest package is separate from the Flock SDK and installable
        run: bash "Tooling~/check-playtest-package.sh" .

  error-codes:
    # FlockErrorCode mirrors the backend's detail.code set, and the two have no mechanical link: the codes
    # ship with backend features, the enum is edited here by hand. A code with no member is not an error —
    # it parses to Unknown and reads exactly like a failure the server chose not to code — so the drift is
    # silent by construction. On 2026-08-31 it had reached 25 codes, seven on surface this SDK calls,
    # including the Consume and reward codes that arrived with 1.36.0's own shop work.
    #
    # This is the half that runs without Unity or a backend: it diffs the enum against
    # Tooling~/WireErrorCodes.txt, the checked-in snapshot of the wire contract. It cannot catch a code the
    # backend added since that file was refreshed — refreshing it is a manual step documented in its header.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every wire error code has a FlockErrorCode member
        run: |
          set -euo pipefail

          CODES='Tooling~/WireErrorCodes.txt'
          ENUM='Runtime/Exceptions/FlockErrorCode.cs'

          for f in "$CODES" "$ENUM"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing. The error-code check reads both files; if one moved, update this workflow with it."
              exit 1
            fi
          done

          # The enum's members, one per line. Every member is written "Member,   // wire.code", so the
          # comma is matched without anchoring to end-of-line. Unknown carries "= 0" and is deliberately
          # not matched, since no wire code maps to it.
          { grep -oE '^[[:space:]]+[A-Z][A-Za-z]+,' "$ENUM" || true; } | tr -d ' \t,\r' | sort -u > /tmp/members.txt
          if [ ! -s /tmp/members.txt ]; then
            echo "::error file=$ENUM::No member read. Members are written 'Member,   // wire.code', one per line; if that changed, update this workflow with it."
            exit 1
          fi

          # Section-aware read of the snapshot: [documented] and [undocumented] must have members,
          # [waived] must not.
          awk '
            /^\[.*\]$/ { section = $0; next }
            /^[[:space:]]*#/ { next }
            /^[[:space:]]*$/ { next }
            { gsub(/\r/, ""); print section "\t" $1 }
          ' "$CODES" > /tmp/coded.txt

          # code -> member name: split on . and _, capitalise each part, concatenate. This mirrors
          # FlockErrorCodes.Parse exactly; if that ever stops being a mechanical transform, this breaks
          # loudly rather than quietly passing, which is the right failure. Done in one pass rather than
          # per code, so the check stays a couple of processes instead of a couple of hundred.
          awk -F'\t' '{
            n = split($2, parts, /[._]/); member = ""
            for (i = 1; i <= n; i++) member = member toupper(substr(parts[i], 1, 1)) substr(parts[i], 2)
            print $1 "\t" $2 "\t" member
          }' /tmp/coded.txt > /tmp/expected.txt

          missing=0
          waived_but_present=0

          while IFS=$'\t' read -r section code member; do
            [ -n "$code" ] || continue
            if grep -qx "$member" /tmp/members.txt; then
              if [ "$section" = "[waived]" ]; then
                echo "::error file=$CODES::'$code' is under [waived] but FlockErrorCode.$member exists. If the feature landed, move the code to [documented] and give it a hint in FlockErrorHints.cs."
                waived_but_present=$((waived_but_present + 1))
              fi
            else
              if [ "$section" != "[waived]" ]; then
                echo "::error file=$ENUM::'$code' has no FlockErrorCode member. Add '$member' to its namespace group in FlockErrorCode.cs and a hint for it in FlockErrorHints.cs, or move the code to [waived] in $CODES if this SDK does not call that feature."
                missing=$((missing + 1))
              fi
            fi
          done < /tmp/expected.txt

          # The other direction is a warning, not a failure. A member no listed code maps to is usually a
          # backend rename the SDK did not follow — the member then can never fire, and neither can its
          # hint. It is not an error because the snapshot is refreshed by hand and can legitimately lag.
          cut -f3 /tmp/expected.txt | sort -u > /tmp/expected_members.txt
          comm -23 /tmp/members.txt /tmp/expected_members.txt | while read -r member; do
            [ -n "$member" ] || continue
            echo "::warning file=$ENUM::FlockErrorCode.$member maps to no code in $CODES. Either the snapshot is stale, or the backend renamed the code and this member (and its hint) can never fire."
          done

          total=$(grep -cvE '^[[:space:]]*(#|\[|$)' "$CODES")
          if [ "$missing" -gt 0 ] || [ "$waived_but_present" -gt 0 ]; then
            echo "::error::Error-code drift: $missing code(s) without a member, $waived_but_present waived code(s) that have one."
            exit 1
          fi
          echo "$total wire error codes checked against $(wc -l < /tmp/members.txt) enum members — no drift."

      - name: Every FlockErrorCode member is in the docs' code table
        run: |
          set -euo pipefail

          # Docs~/errors.md lists every member with its wire code. The table was copied from the enum by hand and fell
          # behind twice (8 members by 2026-10-06, 15 by 2026-10-22), so each row is checked against the enum's own lines.
          ENUM='Runtime/Exceptions/FlockErrorCode.cs'
          DOCS='Docs~/errors.md'

          for f in "$ENUM" "$DOCS"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing. This check reads both files; if one moved, update this workflow with it."
              exit 1
            fi
          done

          # One row per member, from its "Member,   // wire.code" line; a member without its code comment is caught below.
          awk '/^[[:space:]]+[A-Z][A-Za-z]+,[[:space:]]+\/\/ [a-z_]+\.[a-z_]+/ {
            gsub(/\r/, ""); member = $1; sub(/,$/, "", member); print "| `" member "` | `" $3 "` |"
          }' "$ENUM" | sort > /tmp/enum_rows.txt
          members=$(grep -cE '^[[:space:]]+[A-Z][A-Za-z]+,' "$ENUM" || true)
          if [ "$members" -eq 0 ]; then
            echo "::error file=$ENUM::No member read. Members are written 'Member,   // wire.code', one per line; if that changed, update this workflow with it."
            exit 1
          fi
          if [ "$(wc -l < /tmp/enum_rows.txt)" -ne "$members" ]; then
            echo "::error file=$ENUM::$members members but $(wc -l < /tmp/enum_rows.txt) carry their wire code as '// namespace.code'. Write every member as 'Member,   // wire.code'."
            exit 1
          fi

          tr -d '\r' < "$DOCS" | { grep -E '^\| `[A-Za-z]+` \| `[a-z_]+\.[a-z_]+` \|$' || true; } | sort > /tmp/doc_rows.txt
          missing=$(comm -23 /tmp/enum_rows.txt /tmp/doc_rows.txt)
          extra=$(comm -13 /tmp/enum_rows.txt /tmp/doc_rows.txt)
          if [ -n "$missing" ] || [ -n "$extra" ]; then
            [ -z "$missing" ] || { echo "::error file=$DOCS::Members missing from the code table (add each row in the enum's order):"; echo "$missing"; }
            [ -z "$extra" ] || { echo "::error file=$DOCS::Rows in the code table that match no member (renamed or removed):"; echo "$extra"; }
            exit 1
          fi
          echo "The docs' code table lists all $members members, each with its wire code."

      - name: Every failure the SDK finds itself says how to fix it
        run: |
          set -euo pipefail

          # Every failure a developer sees says what is wrong and how to fix it. FlockException.Hint falls back to the
          # error's code, or to its kind when the code has none: that fits an answer from the server, which the HTTP
          # client turns into an exception by its status. Any other failure, the SDK's own or an answer from elsewhere
          # (asset storage), has a cause only the place that makes it knows, so it sets Hint: every `new Flock*Exception(`,
          # thrown, logged or handed over. FlockRelayException is left out: its constructor sets the fix for its reason. So
          # is the playtest's ProtokiteClient.cs: every failure out of it, its own and the HTTP client's, takes Protokite's
          # fix from ProtokiteClient.FixFor in one place, as Protokite's refusals carry no Flock error code.
          hits=$(git ls-files -z -- 'Runtime/*.cs' 'Editor/*.cs' 'ProtokitePlaytest~/*.cs' \
            | grep -zv -e '/Tests/' -e '^Runtime/Http/HttpClient\.cs$' -e '^ProtokitePlaytest~/Runtime/ProtokiteClient\.cs$' \
            | xargs -0 perl -0777 -ne 'while (/\bnew (Flock\w*Exception)\(/g) { my $type = $1; next if $type eq "FlockRelayException"; my $start = pos($_); my ($statement) = substr($_, $start) =~ /^(.*?;)\s*\r?\n/s; next if defined $statement && $statement =~ /\bHint\s*=/; my $line = 1 + (substr($_, 0, $start) =~ tr/\n//); print "$ARGV:$line: new $type\n"; }' \
            || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A failure is made without a Hint outside the HTTP client, so it carries only a generic fix. Set Hint to say how to fix it."
            exit 1
          fi
          echo "Every failure the SDK finds itself states its fix."
