name: Consistency

on:
  pull_request:
  push:
    branches: [main]

jobs:
  error-codes:
    # FlockErrorCode mirrors the backend's detail.code set, and the two have no mechanical link: the codes
    # ship with backend features, the enum is edited here by hand. A code with no member is not an error —
    # it parses to Unknown and reads exactly like a failure the server chose not to code — so the drift is
    # silent by construction. On 2026-08-31 it had reached 25 codes, seven on surface this SDK calls,
    # including the Consume and reward codes that arrived with 1.36.0's own shop work.
    #
    # This is the half that runs without Unity or a backend: it diffs the enum against
    # Tooling~/WireErrorCodes.txt, the checked-in snapshot of the wire contract. It cannot catch a code the
    # backend added since that file was refreshed — refreshing it is a manual step documented in its header.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every wire error code has a FlockErrorCode member
        run: |
          set -euo pipefail

          CODES='Tooling~/WireErrorCodes.txt'
          ENUM='Runtime/Exceptions/FlockErrorCode.cs'

          for f in "$CODES" "$ENUM"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing. The error-code check reads both files; if one moved, update this workflow with it."
              exit 1
            fi
          done

          # The enum's members, one per line. Every member is written "Member,   // wire.code", so the
          # comma is matched without anchoring to end-of-line. Unknown carries "= 0" and is deliberately
          # not matched, since no wire code maps to it.
          grep -oE '^[[:space:]]+[A-Z][A-Za-z]+,' "$ENUM" | tr -d ' \t,\r' | sort -u > /tmp/members.txt

          # Section-aware read of the snapshot: [documented] and [undocumented] must have members,
          # [waived] must not.
          awk '
            /^\[.*\]$/ { section = $0; next }
            /^[[:space:]]*#/ { next }
            /^[[:space:]]*$/ { next }
            { gsub(/\r/, ""); print section "\t" $1 }
          ' "$CODES" > /tmp/coded.txt

          # code -> member name: split on . and _, capitalise each part, concatenate. This mirrors
          # FlockErrorCodes.Parse exactly; if that ever stops being a mechanical transform, this breaks
          # loudly rather than quietly passing, which is the right failure. Done in one pass rather than
          # per code, so the check stays a couple of processes instead of a couple of hundred.
          awk -F'\t' '{
            n = split($2, parts, /[._]/); member = ""
            for (i = 1; i <= n; i++) member = member toupper(substr(parts[i], 1, 1)) substr(parts[i], 2)
            print $1 "\t" $2 "\t" member
          }' /tmp/coded.txt > /tmp/expected.txt

          missing=0
          waived_but_present=0

          while IFS=$'\t' read -r section code member; do
            [ -n "$code" ] || continue
            if grep -qx "$member" /tmp/members.txt; then
              if [ "$section" = "[waived]" ]; then
                echo "::error file=$CODES::'$code' is under [waived] but FlockErrorCode.$member exists. If the feature landed, move the code to [documented] and give it a hint in FlockErrorHints.cs."
                waived_but_present=$((waived_but_present + 1))
              fi
            else
              if [ "$section" != "[waived]" ]; then
                echo "::error file=$ENUM::'$code' has no FlockErrorCode member. Add '$member' to its namespace group in FlockErrorCode.cs and a hint for it in FlockErrorHints.cs, or move the code to [waived] in $CODES if this SDK does not call that feature."
                missing=$((missing + 1))
              fi
            fi
          done < /tmp/expected.txt

          # The other direction is a warning, not a failure. A member no listed code maps to is usually a
          # backend rename the SDK did not follow — the member then can never fire, and neither can its
          # hint. It is not an error because the snapshot is refreshed by hand and can legitimately lag.
          cut -f3 /tmp/expected.txt | sort -u > /tmp/expected_members.txt
          comm -23 /tmp/members.txt /tmp/expected_members.txt | while read -r member; do
            [ -n "$member" ] || continue
            echo "::warning file=$ENUM::FlockErrorCode.$member maps to no code in $CODES. Either the snapshot is stale, or the backend renamed the code and this member (and its hint) can never fire."
          done

          total=$(grep -cvE '^[[:space:]]*(#|\[|$)' "$CODES")
          if [ "$missing" -gt 0 ] || [ "$waived_but_present" -gt 0 ]; then
            echo "::error::Error-code drift: $missing code(s) without a member, $waived_but_present waived code(s) that have one."
            exit 1
          fi
          echo "$total wire error codes checked against $(wc -l < /tmp/members.txt) enum members — no drift."
